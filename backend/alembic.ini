# A generic, single database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate new migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path pathposts to be prepended to the system path in env.py
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# version location specification; this defaults
# to migrations/versions.  When using multiple version
# directories, paths must be separated by spaces or lines.
# version_locations = %(here)s/bar %(here)s/bat migrations/versions

# the direct sqlalchemy URL.  This is overridden in env.py using settings.DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://postgres:postgrespassword@localhost:5432/complianceos

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
